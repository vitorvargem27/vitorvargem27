<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 235" width="1200" height="235" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <style>
    .wave2 { animation: drift 9s ease-in-out infinite alternate; }
    .title { animation: fade 1.2s ease-out both; }
    .sub   { animation: fade 1.2s ease-out .5s both; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(0); } }
    @keyframes fade  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <path class="wave2" fill="url(#g2)" opacity=".35"
        d="M-120,0 H1320 V200 C1150,150 1000,245 800,200 C600,155 450,250 250,205 C100,170 0,225 -120,200 Z"/>
  <path fill="url(#g)"
        d="M0,0 H1200 V180 C1020,235 840,130 620,180 C400,230 220,130 0,178 Z"/>

  <text class="title" x="600" y="105" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700" fill="#ffffff" letter-spacing="1">Vitor Vargem</text>
  <text class="sub" x="600" y="148" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#ffffff" fill-opacity=".92">Software Engineer @ TOTVS  •  IA &amp; Machine Learning</text>
</svg>
